<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <title>Message sent — Farwa Ramzan</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0d'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='%23f0728f' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .thanks { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
        .thanks .report { max-width: 480px; width: 100%; }
        .thanks h1 { font-size: 28px; letter-spacing: -0.03em; font-family: var(--font-sans); margin: 4px 0 10px; }
        .thanks p.lede { font-family: var(--font-sans); font-size: 15px; color: var(--muted); margin-bottom: 24px; }
    </style>
</head>

<body>
    <main class="thanks">
        <div class="report">
            <div class="report-head">
                <span class="report-file">contact-form.log</span>
                <span class="pill pill-pass"><span class="pill-dot"></span>Sent</span>
            </div>
            <div class="report-body">
                <h1>Thank you.</h1>
                <p class="lede">Your message has been received. I'll get back to you soon.</p>
                <a href="/" class="btn btn-primary">Back to site</a>
            </div>
        </div>
    </main>
</body>

</html>
